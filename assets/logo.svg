<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1b2a"/>
      <stop offset="100%" stop-color="#16385c"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f3e26"/>
    </linearGradient>
    <linearGradient id="sensorWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#0c1b2a" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="url(#crestGrad)"/>
  
  <!-- Mountain Slopes & Layers -->
  <!-- Back Mountain -->
  <polygon points="20,68 45,34 70,68" fill="#1e3a5f" opacity="0.6"/>
  <!-- Middle Mountain -->
  <polygon points="35,68 60,30 85,68" fill="#1b4d3e" opacity="0.8"/>
  <!-- Front Slope with Landslide / Fault Line Indicator -->
  <polygon points="15,74 40,42 65,74" fill="url(#mountainGrad)"/>
  
  <!-- Geological Early Warning Pulse Wave -->
  <path d="M 22,46 Q 35,32 50,42 T 78,36" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2,3"/>
  <circle cx="50" cy="42" r="3" fill="#f59e0b"/>
  <circle cx="50" cy="42" r="5" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  
  <!-- Sensor Radar Rings -->
  <path d="M 38,24 A 16,16 0 0,1 62,24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 43,28 A 10,10 0 0,1 57,28" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="30" r="2" fill="#38bdf8"/>
  
  <!-- Base Road Path / Highway -->
  <path d="M 20,74 Q 50,66 80,74" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20,74 Q 50,66 80,74" fill="none" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- 8 Stars for 8 NE States -->
  <g fill="#f8fafc" opacity="0.9">
    <circle cx="50" cy="12" r="1.2"/>
    <circle cx="68" cy="16" r="1.2"/>
    <circle cx="82" cy="30" r="1.2"/>
    <circle cx="86" cy="50" r="1.2"/>
    <circle cx="14" cy="50" r="1.2"/>
    <circle cx="18" cy="30" r="1.2"/>
    <circle cx="32" cy="16" r="1.2"/>
    <circle cx="50" cy="88" r="1.2"/>
  </g>
</svg>
